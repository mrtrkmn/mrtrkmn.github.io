baseURL: "https://mrturkmen.com/"
title: mrturkmen
theme: emacs

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

params:
  title: Ahmet Turkmen
  description: "Contains notes and blog posts"
  keywords: [gRPC, docker, go, golang, cloud, virtualization, python]
  author: mrturkmen
  images: ["/profile.jpg"]
  # Emacs theme: GitHub handle shown in the Help menu
  github: mrtrkmn
  tocTitle: "Table of Contents"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10

# Emacs theme styles code blocks from its own syntax.css, so Hugo must
# emit highlight classes instead of inline styles.
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      # Posts embed hand-written HTML (tables, a YouTube embed, an <img>);
      # without this Goldmark drops it silently.
      unsafe: true

services:
  googleAnalytics:
    ID: UA-165248542-1

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
